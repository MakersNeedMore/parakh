services:
  api:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////service/data/deepfake.db
      UPLOAD_DIR: /service/uploads
    volumes:
      - deepfake-data:/service/data
      - ./uploads:/service/uploads
      - ./model-cache:/root/.cache/huggingface
    restart: unless-stopped

volumes:
  deepfake-data:
